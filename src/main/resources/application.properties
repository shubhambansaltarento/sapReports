spring.application.name=dynpro

# No real database is wired in yet (see docs/spec/jdbc-connection.md - source DB
# topology is still an open question). Excluding these keeps the app bootable
# on spring-boot-starter-data-jpa alone; remove once a real DataSource lands.
spring.autoconfigure.exclude=org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

# Local secrets file (gitignored) - holds real databricks.* values for local
# dev. In deployed environments, set the equivalent DATABRICKS_* env vars
# instead (Spring's relaxed binding maps them to the same keys). Either way,
# no secret value is ever committed.
spring.config.import=optional:classpath:application-secrets.properties

# Databricks SQL Warehouse (OAuth M2M service principal). Empty defaults so
# the app still boots when neither source above is present.
databricks.server-hostname=${DATABRICKS_SERVER_HOSTNAME:}
databricks.http-path=${DATABRICKS_HTTP_PATH:}
databricks.client-id=${DATABRICKS_CLIENT_ID:}
databricks.client-secret=${DATABRICKS_CLIENT_SECRET:}

